<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Immich → Google Photos v{{version}}</title>
<style>
body{font-family:system-ui;margin:0;background:#111;color:#eee}.wrap{max-width:1150px;margin:auto;padding:24px}
h1{font-size:25px}.cards{display:flex;gap:12px;flex-wrap:wrap}.card{background:#1d1d1d;border-radius:12px;padding:15px;min-width:130px}
.big{font-size:28px;font-weight:700}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
button,a.btn{border:0;border-radius:8px;padding:10px 14px;background:#eee;color:#111;text-decoration:none;cursor:pointer}
.primary{font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:#1d1d1d;padding:8px;border-radius:10px}.item img{width:100%;height:120px;object-fit:cover;border-radius:7px}.sent{opacity:.42}
.name{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}progress{width:100%;height:20px}
pre{background:#080808;padding:12px;border-radius:10px;height:180px;overflow:auto;white-space:pre-wrap}
small{color:#aaa}
</style></head><body><div class="wrap">
<h1>Immich → Google Photos <small>v{{version}} · Manual Select</small></h1>
<div class="cards"><div class="card">W albumie<div class="big" id="total">–</div></div><div class="card">Nowe<div class="big" id="new">–</div></div><div class="card">Wysłane<div class="big" id="sent">–</div></div></div>
<details id="reviewPanel"><summary>Archiwum spraw do weryfikacji: <strong id="review">–</strong> (nie są ponownie wysyłane)</summary><div id="reviewGrid" class="grid"></div></details>
<div class="toolbar"><button onclick="createAlbum()">Utwórz album Google Photos</button><button onclick="load()">Odśwież podgląd</button><button onclick="selectNew()">Zaznacz nowe</button><button onclick="clearSel()">Odznacz</button><button class="primary" onclick="send()">WYŚLIJ ZAZNACZONE</button><button onclick="ctrl('pause')">Pauza</button><button onclick="ctrl('resume')">Wznów</button><button onclick="ctrl('cancel')">Anuluj</button><a class="btn" href="/api/history.csv">Historia CSV</a><a class="btn" href="/api/review.csv">Do weryfikacji CSV</a><a class="btn" href="/api/review-audit.csv">Decyzje CSV</a><button onclick="backup()">Backup bazy</button><button onclick="clearSession()">Wyczyść widok sesji</button></div>
<progress id="prog" value="0" max="1"></progress><div id="cur"><small>Gotowy.</small></div>
<div id="albumState"><small>Sprawdzanie albumu docelowego…</small></div>
<h3>Podgląd przed wysłaniem</h3><div id="grid" class="grid"></div>
<h3>Log ostatniej operacji (pamięć sesji)</h3><pre id="log"></pre>
</div><script>
let items=[];
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safeId(v){return encodeURIComponent(String(v??''))}
async function load(){let r=await fetch('/api/preview');let j=await r.json();if(j.error){alert(j.error);return}
items=j.items;albumState.textContent=j.config.google_album_id?'Album Google Photos: '+j.config.google_album+' (skonfigurowany)':'Album Google Photos: '+j.config.google_album+' — wymagane utworzenie przed wysyłką';total.textContent=j.total;newEl=document.getElementById('new');newEl.textContent=j.new;sent.textContent=j.sent;document.getElementById("review").textContent=j.review;
grid.innerHTML=items.filter(x=>!x.review).map(x=>`<div class="item ${(x.sent||x.review)?'sent':''}"><img src="/thumb/${safeId(x.id)}"><div><input type="checkbox" data-id="${escapeHtml(x.id)}" ${(x.sent||x.review)?'disabled':''}> ${x.sent?'✓ wysłane':(x.review?'⚠ sprawdź w Google Photos':'do wysłania')}</div>${x.review?`<div><button type="button" class="review-action" data-action="confirmed_sent" data-asset="${escapeHtml(x.id)}">Potwierdź wysłanie</button><button type="button" class="review-action" data-action="retry" data-asset="${escapeHtml(x.id)}">Odblokuj ponowną wysyłkę</button></div>`:''}<div class="name">${escapeHtml(x.name)}</div></div>`).join('');
reviewGrid.innerHTML=items.filter(x=>x.review).map(x=>`<div class="item sent"><img src="/thumb/${safeId(x.id)}"><div>⚠ sprawdź w Google Photos</div><div><button type="button" class="review-action" data-action="confirmed_sent" data-asset="${escapeHtml(x.id)}">Potwierdź wysłanie</button><button type="button" class="review-action" data-action="retry" data-asset="${escapeHtml(x.id)}">Odblokuj ponowną wysyłkę</button></div><div class="name">${escapeHtml(x.name)}</div></div>`).join('')}
async function resolveReview(aid,decision){
if(!confirm(decision==='retry'?'Czy sprawdzono Google Photos i potwierdzono brak zdjęcia? Zezwolić na ponowną wysyłkę?':'Czy potwierdzono obecność zdjęcia w Google Photos i znany jest jego identyfikator?'))return;
let mediaId=null;
if(decision==='confirmed_sent'){mediaId=prompt('Wpisz identyfikator media item z Google Photos:');if(!mediaId||!mediaId.trim())return;}
let confirmation=prompt('Aby potwierdzić, wpisz dokładnie: '+decision+':'+aid);
if(confirmation!==decision+':'+aid)return alert('Potwierdzenie niezgodne. Nie zmieniono stanu.');
let r=await fetch('/api/review/resolve',{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},body:JSON.stringify({asset_id:aid,decision,confirmation,media_item_id:mediaId})});
let result=await r.json();if(!r.ok)return alert(result.error||'Błąd');
await load();
}
document.addEventListener('click',event=>{let button=event.target.closest('button.review-action');if(!button)return;event.preventDefault();resolveReview(button.dataset.asset,button.dataset.action)});
async function createAlbum(){
let r=await fetch('/api/config');let c=await r.json();
if(c.google_album_id)return alert('Album docelowy jest już skonfigurowany.');
if(!confirm('Utworzyć nowy album Google Photos „'+c.google_album+'”? Sprawdź wcześniej, czy taki album już nie istnieje.'))return;
let confirmation=prompt('Aby utworzyć album, wpisz dokładnie: CREATE:'+c.google_album);
if(confirmation!=='CREATE:'+c.google_album)return alert('Anulowano.');
let result=await fetch('/api/google-album/create',{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},body:JSON.stringify({confirmation})});
let data=await result.json();
alert(result.ok?'Album utworzony. ID: '+data.album_id:(data.error||'Błąd; sprawdź Google Photos przed ponowną próbą.'));
if(result.ok)await load();
}
function selectNew(){document.querySelectorAll('input[type=checkbox]:not(:disabled)').forEach(x=>x.checked=true)}
function clearSel(){document.querySelectorAll('input[type=checkbox]').forEach(x=>x.checked=false)}
async function send(){let ids=[...document.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.dataset.id);if(!ids.length)return alert('Nic nie zaznaczono.');
if(!confirm(`Wysłać ${ids.length} wybranych plików do Google Photos?`))return;
let r=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},body:JSON.stringify({ids})});if(!r.ok)alert(await r.text())}
async function ctrl(c){let r=await fetch('/api/control/'+c,{method:'POST',headers:{'X-Requested-With':'XMLHttpRequest'}});if(!r.ok)alert(await r.text())}
async function backup(){let r=await fetch('/api/backup',{method:'POST',headers:{'X-Requested-With':'XMLHttpRequest'}});let j=await r.json();alert(r.ok&&j.ok?'Backup zapisany jako /data/state-backup.db':(j.error||'Błąd'))}
async function clearSession(){if(!confirm("Wyczyścić licznik i log sesji? Historia zdjęć pozostanie bez zmian."))return;let r=await fetch("/api/session/clear",{method:"POST",headers:{"X-Requested-With":"XMLHttpRequest"}});let j=await r.json();if(!r.ok)return alert(j.error||"Błąd");await poll();await load()}
async function poll(){let s=await (await fetch('/api/status')).json();prog.max=Math.max(s.total,1);prog.value=s.done;cur.textContent=s.running?`Praca · ${s.done}/${s.total} ${s.paused?"· PAUZA":""} ${s.current?"· "+s.current:""}`:"Gotowy (brak aktywnej kolejki)";log.textContent=s.logs.join('\n');log.scrollTop=log.scrollHeight;if(!s.running&&window.wasRunning)load();window.wasRunning=s.running}
load();setInterval(poll,1000);
</script></body></html>
