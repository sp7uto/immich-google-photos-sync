services:
  immich-google-sync:
    # Opt-in hardening. Keep the default compose file unchanged.
    user: "${APP_UID:?Set APP_UID to an existing host UID}:${APP_GID:?Set APP_GID to an existing host GID}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
