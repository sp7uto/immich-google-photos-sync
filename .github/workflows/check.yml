name: Source checks
on:
  push:
  pull_request:
jobs:
  syntax-and-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax check
        run: |
          python -m py_compile app/app.py get_google_token.py
      - name: Offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Check for committed private data
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          bad = []
          for f in files:
              p = pathlib.PurePosixPath(f)
              if p.name in {"token.json", "credentials.json", ".env", "state.db", "state-backup.db"} or p.suffix in {".sqlite", ".sqlite3"}:
                  bad.append(f)
          if bad:
              print("Private files must not be committed:", *bad, sep="\n")
              sys.exit(1)
          print("No known credential or state filenames committed")
          PY
