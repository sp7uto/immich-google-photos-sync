name: Source checks
on:
  push:
  pull_request:
jobs:
  syntax-and-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax check
        run: |
          python -m py_compile app/app.py get_google_token.py
      - name: Offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Check for committed private data
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          bad = []
          for f in files:
              p = pathlib.PurePosixPath(f)
              if p.name in {"token.json", "credentials.json", ".env", "state.db", "state-backup.db"} or p.suffix in {".sqlite", ".sqlite3"}:
                  bad.append(f)
          if bad:
              print("Private files must not be committed:", *bad, sep="\n")
              sys.exit(1)
          print("No known credential or state filenames committed")
          PY

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag immich-google-sync:ci .
      - name: Start isolated container without production credentials
        run: |
          docker run -d --name immich-sync-smoke \
            -p 127.0.0.1:18787:8787 \
            -e IMMICH_URL=http://127.0.0.1:9999 \
            -e IMMICH_API_KEY=not-a-real-key \
            immich-google-sync:ci
      - name: Verify web panel and status API
        run: |
          set -eu
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18787/api/status -o /tmp/status.json; then break; fi
            sleep 1
          done
          python - <<'PY'
          import json
          data=json.load(open('/tmp/status.json'))
          assert data['running'] is False
          assert data['done'] == 0
          PY
          curl -fsS http://127.0.0.1:18787/ | grep -q 'Manual Select'
          curl -fsS http://127.0.0.1:18787/api/config | python -c 'import json,sys; assert json.load(sys.stdin)["include_video"] is False'
          # Negative-path tests must not contact Immich or Google.
          test "$(curl -sS -o /tmp/bad.json -w '%{http_code}' \
            -X POST http://127.0.0.1:18787/api/send \
            -H 'Content-Type: application/json' \
            -d '{"ids":"not-a-list"}')" = "400"
          curl -fsS http://127.0.0.1:18787/api/test \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert d["immich"] is False and d["google"] is False'

      - name: Print container logs on failure
        if: failure()
        run: docker logs immich-sync-smoke
      - name: Stop test container
        if: always()
        run: docker rm -f immich-sync-smoke || true
