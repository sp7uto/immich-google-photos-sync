name: Source checks
on:
  push:
  pull_request:
jobs:
  syntax-and-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax check
        run: |
          python -m py_compile app/app.py get_google_token.py
      - name: Inline JavaScript syntax check (without execution)
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inside = False
                  self.parts = []
                  self.blocks = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script" and not dict(attrs).get("src"):
                      self.inside = True
                      self.parts = []
              def handle_data(self, data):
                  if self.inside:
                      self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag == "script" and self.inside:
                      self.blocks.append("".join(self.parts))
                      self.inside = False

          parser = Scripts()
          parser.feed(Path("app/templates/index.html").read_text(encoding="utf-8"))
          if not parser.blocks:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/immich-inline-script.js").write_text("\\n".join(parser.blocks), encoding="utf-8")
          PY
          node --check /tmp/immich-inline-script.js
      - name: Offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Check for committed private data
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          bad = []
          for f in files:
              p = pathlib.PurePosixPath(f)
              if p.name in {"token.json", "credentials.json", ".env", "state.db", "state-backup.db"} or p.suffix in {".sqlite", ".sqlite3"}:
                  bad.append(f)
          if bad:
              print("Private files must not be committed:", *bad, sep="\n")
              sys.exit(1)
          print("No known credential or state filenames committed")
          PY

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image without starting containers
        run: docker build --tag immich-google-sync:ci .
