name: Source checks
on:
  push:
  pull_request:
jobs:
  syntax-and-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax check
        run: |
          python -m py_compile app/app.py get_google_token.py
      - name: Inline JavaScript syntax check (without execution)
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inside = False
                  self.parts = []
                  self.blocks = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script" and not dict(attrs).get("src"):
                      self.inside = True
                      self.parts = []
              def handle_data(self, data):
                  if self.inside:
                      self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag == "script" and self.inside:
                      self.blocks.append("".join(self.parts))
                      self.inside = False

          parser = Scripts()
          parser.feed(Path("app/templates/index.html").read_text(encoding="utf-8"))
          if not parser.blocks:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/immich-inline-script.js").write_text("\\n".join(parser.blocks), encoding="utf-8")
          PY
          node --check /tmp/immich-inline-script.js
      - name: Offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Check for committed private data
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          bad = []
          for f in files:
              p = pathlib.PurePosixPath(f)
              if p.name in {"token.json", "credentials.json", ".env", "state.db", "state-backup.db"} or p.suffix in {".sqlite", ".sqlite3"}:
                  bad.append(f)
          if bad:
              print("Private files must not be committed:", *bad, sep="\n")
              sys.exit(1)
          print("No known credential or state filenames committed")
          PY

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag immich-google-sync:ci .
      - name: Start container and check real HTTP responses (no external services)
        run: |
          set -euo pipefail
          name="immich-sync-smoke-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$name" --publish 127.0.0.1:18787:8787 immich-google-sync:ci
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:18787"
          def request(path, data=None, headers=None):
              req = urllib.request.Request(base + path, data=data, headers=headers or {})
              try:
                  with urllib.request.urlopen(req, timeout=2) as res:
                      return res.status, res.read(), res.headers
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read(), exc.headers

          for attempt in range(40):
              try:
                  status, body, headers = request("/api/status")
                  if status == 200:
                      break
              except (OSError, TimeoutError):
                  pass
              time.sleep(0.5)
          else:
              raise SystemExit("Container did not become ready")

          assert json.loads(body)["running"] is False
          assert headers.get("Cache-Control") == "no-store"
          status, body, _ = request("/")
          assert status == 200 and b"Immich" in body
          status, body, _ = request("/api/config")
          assert status == 200 and json.loads(body)["google_album_id"] == ""

          payload = json.dumps({"ids": ["no-real-asset"]}).encode()
          status, _, _ = request("/api/send", payload, {"Content-Type": "application/json"})
          assert status == 403, f"Expected CSRF guard, got {status}"
          status, _, _ = request("/api/send", payload, {
              "Content-Type": "application/json", "X-Requested-With": "XMLHttpRequest"
          })
          assert status == 409, f"Expected missing album guard, got {status}"
          status, body, _ = request("/api/status")
          assert status == 200 and json.loads(body)["running"] is False
          print("Real container HTTP smoke checks passed; no external requests or uploads")
          PY
